# Build de la app mobile, a pedido.
#
# Se dispara a mano desde la pestaña Actions de GitHub (botón "Run workflow"),
# nunca sola. Es deliberado: una build por push quemaría la cuota en dos días.
# Cuando haya ritmo de release se agrega un disparo por tag; hasta entonces, el
# commit que reciben las testers se elige a mano.
#
# Hay dos lugares donde compilar, y se elige con el input `donde`:
#
# - **runner** (por defecto): compila acá mismo, en la máquina de GitHub, con
#   `eas build --local`. Usa las mismas credenciales y la misma firma que EAS
#   —las baja de EAS—, así que el APK se instala encima de uno hecho allá. No
#   pasa por la cola del plan gratis de EAS, que llegó a tardar dos horas en
#   arrancar, ni gasta las builds del mes: gasta minutos de Actions (una build
#   ronda los 20-30). El artefacto queda en el resumen del workflow.
#   Solo Android: iOS necesita un runner de macOS, que cuesta diez veces más.
#
# - **eas**: SOLO encola en los servidores de EAS y termina en segundos; el
#   progreso y el artefacto se miran en expo.dev. Es la única vía para iOS.
#
# Con las dos, el runtime version se calcula entero en un `npm ci` limpio. Desde
# la máquina local, un `node_modules` desincronizado del lockfile hace fallar la
# build en "Configure expo-updates" (ver APP_MOBILE_ROADMAP.md).
#
# Se usa `npx eas-cli` con `EXPO_TOKEN` en el entorno, en vez de la action de
# Expo: es un paso menos que versionar y la autenticación es la misma.
#
# Requisitos, los dos de una sola vez:
#   1. `eas init` corrido en client-app/, con el `projectId` commiteado.
#   2. Un secret `EXPO_TOKEN` en el repo (Settings → Secrets → Actions), que es
#      un access token de la cuenta de Expo dueña del proyecto.
# Si falta cualquiera de los dos, el job corta en el primer paso con el motivo.

name: EAS Build

on:
  workflow_dispatch:
    inputs:
      donde:
        description: Dónde compilar
        type: choice
        default: runner
        options:
          - runner   # en GitHub, sin cola (solo Android)
          - eas      # encola en EAS (cola del plan gratis)
      plataforma:
        description: Plataforma (con runner, solo android)
        type: choice
        default: android
        options: [android, ios, all]
      perfil:
        description: Perfil de eas.json
        type: choice
        default: preview
        options:
          - preview                 # APK para las testers
          - development             # dev build (se conecta a Metro)
          - preview-simulador-ios   # .app de simulador; no necesita cuenta de Apple
          - production              # AAB / envío a tiendas

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ inputs.donde }} · ${{ inputs.plataforma }} · ${{ inputs.perfil }})
    runs-on: ubuntu-latest
    # Una build de React Native con caché fría ronda la media hora. El margen es
    # para que una colgada no se coma los minutos del mes.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # Las formas de fallar que no se explican solas. Sin esto, el error
      # aparece recién adentro del CLI y es críptico.
      - name: Chequeos previos
        env:
          HAY_TOKEN: ${{ secrets.EXPO_TOKEN != '' }}
        run: |
          if [ ! -f client-app/app.json ]; then
            echo "::error::La app mobile no está en la rama '${{ github.ref_name }}'. Corré este workflow desde una rama Mobile/**."
            exit 1
          fi
          if [ "$HAY_TOKEN" != "true" ]; then
            echo "::error::Falta el secret EXPO_TOKEN. Se saca de expo.dev (Access tokens) y se carga en Settings → Secrets and variables → Actions."
            exit 1
          fi
          if ! grep -q '"projectId"' client-app/app.json; then
            echo "::error::client-app/app.json no tiene extra.eas.projectId todavía. Corré 'eas init' dentro de client-app/ y commiteá el cambio."
            exit 1
          fi
          if [ "${{ inputs.donde }}" = "runner" ] && [ "${{ inputs.plataforma }}" != "android" ]; then
            echo "::error::En el runner solo se compila Android: iOS necesita macOS. Para iOS elegí donde = eas."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          # La misma major que la máquina de desarrollo.
          node-version: '22'
          cache: npm
          cache-dependency-path: client-app/package-lock.json

      - name: Instalar dependencias
        working-directory: client-app
        run: npm ci

      # ------------------------------------------------------------------
      # donde = eas: encolar y salir
      # ------------------------------------------------------------------

      # `--no-wait` sale apenas queda encolada. El progreso se mira en el
      # dashboard, con el link que imprime acá abajo.
      - name: Encolar la build en EAS
        if: inputs.donde == 'eas'
        working-directory: client-app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli build \
            --platform "${{ inputs.plataforma }}" \
            --profile "${{ inputs.perfil }}" \
            --non-interactive \
            --no-wait

      # Sin `always()`: si la build no se pudo encolar, este resumen mentiría.
      - name: Dónde seguirla
        if: inputs.donde == 'eas'
        run: |
          {
            echo "### Build encolada en EAS"
            echo ""
            echo "El link exacto está en el log del paso anterior."
            echo "El progreso y el artefacto se miran en expo.dev, proyecto \`ame-esencial\` → Builds."
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------------
      # donde = runner: compilar acá
      # ------------------------------------------------------------------

      # El runner ya trae el SDK de Android; el JDK se fija para no depender de
      # cuál venga por defecto en la imagen. La caché de Gradle es lo que baja
      # la segunda build de media hora a unos quince minutos.
      - uses: actions/setup-java@v4
        if: inputs.donde == 'runner'
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: client-app/package-lock.json

      - name: Compilar en el runner
        if: inputs.donde == 'runner'
        working-directory: client-app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          # production sale como AAB (para la Play Store); el resto, APK.
          if [ "${{ inputs.perfil }}" = "production" ]; then ext=aab; else ext=apk; fi
          echo "EXT=$ext" >> "$GITHUB_ENV"
          npx eas-cli build \
            --local \
            --platform android \
            --profile "${{ inputs.perfil }}" \
            --non-interactive \
            --output "$RUNNER_TEMP/ame-esencial-${{ inputs.perfil }}.$ext"

      - name: Subir el artefacto
        if: inputs.donde == 'runner'
        uses: actions/upload-artifact@v4
        with:
          name: ame-esencial-${{ inputs.perfil }}-${{ github.sha }}
          path: ${{ runner.temp }}/ame-esencial-${{ inputs.perfil }}.${{ env.EXT }}
          # Ya no sirve cuando sale la siguiente; no hace falta guardarlo más.
          retention-days: 14
          if-no-files-found: error
          # Un APK ya viene comprimido: volver a comprimirlo solo gasta tiempo.
          compression-level: 0

      - name: Dónde bajarla
        if: inputs.donde == 'runner'
        run: |
          {
            echo "### Build lista"
            echo ""
            echo "Perfil \`${{ inputs.perfil }}\`, commit \`${GITHUB_SHA::7}\`."
            echo "El ${EXT^^} está en **Artifacts**, al pie de esta página. GitHub lo baja dentro de un .zip."
          } >> "$GITHUB_STEP_SUMMARY"
