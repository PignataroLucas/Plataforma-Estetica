# Integración continua.
#
# Existe por un motivo concreto: la suite completa del backend **nunca había
# estado entera en verde**. En la rama de la app mobile, veinticuatro tests
# fallaban al correr todo junto por una configuración de test que se filtraba
# entre módulos, y como cada módulo pasaba por separado nadie se enteró durante
# meses. Eso es exactamente lo que un pipeline detecta el primer día.
#
# Un solo archivo sirve para todas las ramas. `main` tiene el backend y el CRM;
# la app mobile vive en `Mobile/**`. Por eso el job de la app se saltea solo
# cuando no encuentra el proyecto, en vez de mantener dos workflows que se van
# a desincronizar.
#
# El lint del CRM ya entra y bloquea, pero solo por **errores**: los 39 que
# arrastraba se saldaron (entre ellos un `useState` después de un early return
# que rompía el dashboard de analytics al llegar los datos). Los 152 warnings
# quedan visibles sin frenar el merge; se van pagando de a poco. Por eso el job
# llama a `eslint` directo y no a `npm run lint`, que trae `--max-warnings 0`.
#
# El lint de la app mobile es informativo por ahora: `eslint-config-expo` 57
# sumó las reglas del React Compiler y marca 4 errores en los flujos de reserva
# y checkout. Arreglarlos es refactor de código que anda, no trabajo de CI.

name: CI

on:
  push:
    branches: [main, 'Mobile/**']
  pull_request:
    branches: [main, 'Mobile/**']

# Un push nuevo sobre la misma rama cancela la corrida anterior: no tiene
# sentido gastar minutos validando un commit que ya quedó viejo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · tests
    runs-on: ubuntu-latest

    services:
      # Mismas versiones que docker-compose, para que un test que pasa acá
      # signifique lo mismo que uno que pasa en la máquina de desarrollo.
      db:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: plataforma_estetica
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/plataforma_estetica
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: clave-solo-para-ci-no-usar-en-ningun-lado
      DEBUG: 'True'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'      # la misma del Dockerfile
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar que no falten migraciones
        working-directory: backend
        # Un modelo cambiado sin su migración rompe el despliegue, no los tests.
        # Este chequeo lo agarra acá y no en producción.
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        working-directory: backend
        run: pytest -q

  crm:
    name: CRM · typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

  crm-lint:
    name: CRM · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        # `eslint` directo y no `npm run lint`: ese script lleva
        # `--max-warnings 0` y hoy hay 152 warnings. Acá bloquean los errores,
        # que son los que rompen algo; los warnings se ven en el log.
        run: npx eslint . --ext ts,tsx

  crm-tests:
    name: CRM · tests
    runs-on: ubuntu-latest

    # Aparte del typecheck y no un paso más de ese job: son dos preguntas
    # distintas ("¿compila?" y "¿funciona?") y conviene ver cuál de las dos se
    # rompió sin abrir los logs. Corren en paralelo, así que no cuesta tiempo.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'      # la misma del contenedor de frontend
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci
      - name: Tests
        working-directory: frontend
        # `npm test` es `vitest run`: sin `run`, vitest se queda en modo watch y
        # el job cuelga hasta el timeout.
        run: npm test

  crm-build:
    name: CRM · build
    runs-on: ubuntu-latest

    # `tsc --noEmit` no prueba que el bundle salga: los fallos de resolución de
    # imports, los assets que no existen y los plugins de Vite mal configurados
    # solo aparecen al empaquetar de verdad. Se despliega el build, no el tsc.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        # `vite build` pelado y no `npm run build`: ese script es `tsc && vite
        # build`, y el typecheck ya tiene su propio job. Correrlo dos veces solo
        # gasta minutos y ensucia de cuál de los dos vino la falla.
        run: npx vite build

  app:
    name: App mobile · typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # En `main` no existe el proyecto de la app: solo viven ahí unos archivos
      # generados de Expo. El job se saltea en lugar de fallar, así el mismo
      # workflow sirve en las dos ramas.
      - name: ¿Está la app en esta rama?
        id: proyecto
        run: |
          if [ -f client-app/package.json ]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "La app mobile no está en esta rama; no hay nada que chequear."
          fi

      - uses: actions/setup-node@v4
        if: steps.proyecto.outputs.existe == 'true'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client-app/package-lock.json

      - name: Instalar dependencias
        if: steps.proyecto.outputs.existe == 'true'
        working-directory: client-app
        run: npm ci

      - name: Typecheck
        if: steps.proyecto.outputs.existe == 'true'
        working-directory: client-app
        run: npx tsc --noEmit

      - name: Lint (informativo)
        # No bloquea todavía. `eslint-config-expo` 57 trajo las reglas del React
        # Compiler y hay 4 errores abiertos en reservar.tsx y checkout.tsx:
        # `setState` sincrónico dentro de un efecto y una lectura de ref durante
        # el render. Los tres son refactors de flujos que hoy funcionan, así que
        # se corrigen aparte y recién ahí se saca este `continue-on-error`.
        if: steps.proyecto.outputs.existe == 'true'
        continue-on-error: true
        working-directory: client-app
        run: npx expo lint
